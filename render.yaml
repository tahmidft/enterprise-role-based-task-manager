services:
  - type: web
    name: enterprise-role-based-task-manager-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci --legacy-peer-deps && npx nx build api
    startCommand: node api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3333"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: DB_SSL
        value: "true"
      # First boot: sync schema for demo. Flip to false + migrations for long-lived prod.
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: CORS_ORIGIN
        sync: false
