<div class="auth-wrap">
  <button type="button" class="login-theme-toggle" (click)="toggleTheme()" aria-label="Toggle theme">
    <i class="ti ti-sun" [class.active]="!darkMode()"></i>
    <i class="ti ti-moon" [class.active]="darkMode()"></i>
  </button>
  <mat-card class="auth-card">
    <mat-card-content class="auth-content">
      <div class="auth-brand">
        <div class="auth-logo-wrap" aria-hidden="true">
          <i class="ti ti-rocket"></i>
        </div>
        <div class="auth-brand-text">
          <h1 class="auth-app-name">Nexus PM</h1>
          <p class="auth-tagline">Sign in to your account</p>
        </div>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
        <mat-form-field appearance="outline" class="full-width compact-field">
          <mat-label>Email address</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width compact-field">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">Minimum 6 characters</mat-error>
        </mat-form-field>

        <p *ngIf="errorMessage()" class="auth-error" role="alert">
          <mat-icon class="error-icon">error_outline</mat-icon>
          {{ errorMessage() }}
        </p>

        <mat-divider class="auth-divider"><span>or sign in as</span></mat-divider>

        <p class="quick-login-label">Quick login for demo</p>
        <div class="quick-login-row">
          <button
            type="button"
            mat-stroked-button
            class="quick-role-btn"
            *ngFor="let role of quickRoles"
            [disabled]="isLoading()"
            (click)="quickLogin(role)"
          >
            <span [class]="role.dotClass"></span>{{ role.label }}
          </button>
        </div>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="sign-in-btn"
          [disabled]="isLoading()"
        >
          <mat-icon *ngIf="!isLoading()">login</mat-icon>
          {{ isLoading() ? 'Signing in…' : 'Sign In' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
