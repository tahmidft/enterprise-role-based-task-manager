<div class="page team-page">
  <p class="section-eyebrow">Organization</p>

  <div *ngIf="loading()" class="loading-wrap">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <div *ngIf="!loading() && isRestricted()" class="access-wall">
    <i class="ti ti-lock"></i>
    <h2>Access restricted</h2>
    <p>
      Team management is available to Managers and above.
      Contact your organization owner if you need access.
    </p>
  </div>

  <ng-container *ngIf="!loading() && !isRestricted()">
    <div class="team-toolbar">
      <div class="team-search-pill">
        <i class="ti ti-search"></i>
        <input
          type="search"
          placeholder="Search members…"
          [ngModel]="searchText()"
          (ngModelChange)="searchText.set($event)"
          aria-label="Search members"
        />
      </div>
      <button
        *ngIf="canEdit()"
        type="button"
        class="invite-btn"
        (click)="openInvite()"
      >
        <i class="ti ti-user-plus"></i>
        <span>Invite member</span>
      </button>
    </div>

    <div class="role-chips">
      <button
        *ngFor="let r of roleFilters"
        type="button"
        class="role-chip"
        [class.role-chip--active]="roleFilter() === r"
        (click)="roleFilter.set(r)"
      >
        {{ r | titlecase }}
      </button>
    </div>

    <div class="team-grid">
      <div *ngFor="let m of filteredMembers()" class="member-card">
        <div class="member-avatar" [attr.title]="m.name">{{ initials(m) }}</div>
        <div class="member-info">
          <div class="member-name">{{ m.name }}</div>
          <div class="member-email muted">{{ m.email }}</div>
          <span [class]="roleChipClass(m.roleLabel)">{{ m.roleLabel | titlecase }}</span>
        </div>
        <div class="member-actions" *ngIf="canEditUser(m)">
          <button
            type="button"
            class="member-edit-btn"
            (click)="openEdit(m)"
            matTooltip="Edit user"
          >
            <i class="ti ti-edit"></i>
          </button>
        </div>
      </div>

      <div *ngIf="filteredMembers().length === 0" class="team-empty">
        <i class="ti ti-users-group"></i>
        <p>No members found</p>
      </div>
    </div>
  </ng-container>
</div>
